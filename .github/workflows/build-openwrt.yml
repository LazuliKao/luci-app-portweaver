name: Build OpenWrt Packages

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pre-build-full:
    name: Pre-build (portweaver full)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with OpenWrt SDK
        id: build_openwrt
        uses: LazuliKao/gh-action-sdk@main
        continue-on-error: true
        env:
          FEEDNAME: custom
          PACKAGES: portweaver luci-app-portweaver
          ARCH: x86_64-24.10.5
      - name: Update Hash if build failed
        if: ${{ steps.build_openwrt.outcome == 'failure' }}
        continue-on-error: true
        run: |
          if [ -f "portweaver.correct_hash" ]; then
            echo "Found portweaver.correct_hash file."
          else
            echo "ERROR: portweaver.correct_hash file not found!" >&2
            exit 1
          fi
          CORRECT_HASH=$(cat portweaver.correct_hash)
          if [[ ! "$CORRECT_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo "ERROR: Failed to extract valid SHA256 hash" >&2
            exit 1
          fi
          echo "Updating PKG_MIRROR_HASH to $CORRECT_HASH in portweaver/Makefile"
          sed -i -E "s/PKG_MIRROR_HASH:=[a-f0-9]{64}/PKG_MIRROR_HASH:=$CORRECT_HASH/" portweaver/Makefile
          if git diff --quiet --exit-code portweaver/Makefile; then
            echo "No change in portweaver/Makefile; skipping commit."
          else
            git add portweaver/Makefile
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update portweaver PKG_MIRROR_HASH to $CORRECT_HASH"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Re-run Build with OpenWrt SDK
        if: ${{ steps.build_openwrt.outcome == 'failure' }}
        uses: openwrt/gh-action-sdk@main
        env:
          FEEDNAME: custom
          PACKAGES: portweaver luci-app-portweaver
          ARCH: x86_64-24.10.5
          V: ${{ runner.debug == '1' && 's' || '' }}

  pre-build-lite:
    name: Pre-build (portweaver-lite)
    runs-on: ubuntu-latest
    needs: pre-build-full
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with OpenWrt SDK
        id: build_openwrt
        uses: LazuliKao/gh-action-sdk@main
        continue-on-error: true
        env:
          FEEDNAME: custom
          PACKAGES: portweaver-lite luci-app-portweaver
          ARCH: x86_64-24.10.5
      - name: Update Hash if build failed
        if: ${{ steps.build_openwrt.outcome == 'failure' }}
        continue-on-error: true
        run: |
          if [ -f "portweaver-lite.correct_hash" ]; then
            echo "Found portweaver-lite.correct_hash file."
          else
            echo "ERROR: portweaver-lite.correct_hash file not found!" >&2
            exit 1
          fi
          CORRECT_HASH=$(cat portweaver-lite.correct_hash)
          if [[ ! "$CORRECT_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo "ERROR: Failed to extract valid SHA256 hash" >&2
            exit 1
          fi
          echo "Updating PKG_MIRROR_HASH to $CORRECT_HASH in portweaver-lite/Makefile"
          sed -i -E "s/PKG_MIRROR_HASH:=[a-f0-9]{64}/PKG_MIRROR_HASH:=$CORRECT_HASH/" portweaver-lite/Makefile
          if git diff --quiet --exit-code portweaver-lite/Makefile; then
            echo "No change in portweaver-lite/Makefile; skipping commit."
          else
            git add portweaver-lite/Makefile
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update portweaver-lite PKG_MIRROR_HASH to $CORRECT_HASH"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Re-run Build with OpenWrt SDK
        if: ${{ steps.build_openwrt.outcome == 'failure' }}
        uses: openwrt/gh-action-sdk@main
        env:
          FEEDNAME: custom
          PACKAGES: portweaver-lite luci-app-portweaver
          ARCH: x86_64-24.10.5
          V: ${{ runner.debug == '1' && 's' || '' }}

  build:
    name: ${{ matrix.pkg }} / ${{ matrix.arch }} (${{ matrix.openwrt_version }})
    runs-on: ubuntu-latest
    needs: [pre-build-full, pre-build-lite]
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - portweaver
          - portweaver-lite
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
        openwrt_version:
          - "24.10.5"
          - "25.12.0"
        include:
          - {
              pkg: portweaver-lite,
              arch: mips_24kc,
              openwrt_version: "24.10.5",
            }
          - {
              pkg: portweaver-lite,
              arch: mips_24kc,
              openwrt_version: "25.12.0",
            }
          - {
              pkg: portweaver-lite,
              arch: mips_4kec,
              openwrt_version: "24.10.5",
            }
          - {
              pkg: portweaver-lite,
              arch: mips_mips32,
              openwrt_version: "24.10.5",
            }
          - {
              pkg: portweaver-lite,
              arch: mips_mips32,
              openwrt_version: "25.12.0",
            }
          - {
              pkg: portweaver-lite,
              arch: mipsel_24kc,
              openwrt_version: "24.10.5",
            }
          - {
              pkg: portweaver-lite,
              arch: mipsel_24kc,
              openwrt_version: "25.12.0",
            }
          - {
              pkg: portweaver-lite,
              arch: mipsel_74kc,
              openwrt_version: "24.10.5",
            }
          - {
              pkg: portweaver-lite,
              arch: mipsel_74kc,
              openwrt_version: "25.12.0",
            }
          - {
              pkg: portweaver-lite,
              arch: mipsel_mips32,
              openwrt_version: "24.10.5",
            }
          - {
              pkg: portweaver-lite,
              arch: mipsel_mips32,
              openwrt_version: "25.12.0",
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git pull
        run: git pull origin main

      # - name: Install Zig
      #   uses: mlugg/setup-zig@v2
      #   with:
      #     version: 0.16.0

      - name: Build with OpenWrt SDK
        id: build_openwrt
        uses: openwrt/gh-action-sdk@main
        env:
          FEEDNAME: custom
          PACKAGES: ${{ matrix.pkg }} luci-app-portweaver
          ARCH: ${{ matrix.arch }}-${{ matrix.openwrt_version }}
          V: ${{ runner.debug == '1' && 's' || '' }}

      - name: List built packages
        run: |
          echo "=== Listing bin directory ==="
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) || true
          ls -lhR bin/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-${{ matrix.arch }}-${{ matrix.openwrt_version }}
          path: |
            bin/packages/*/custom/*.ipk
            bin/packages/*/custom/*.apk
            bin/targets/*/*/*.ipk
            bin/targets/*/*/*.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Files
        run: |
          mkdir -p release
          for artifact_dir in all-artifacts/portweaver-*; do
            if [ -d "$artifact_dir" ]; then
              # Extract pkg, arch and version from directory name
              # e.g., portweaver-x86_64-24.10.5 or portweaver-lite-x86_64-24.10.5
              dirname=$(basename "$artifact_dir")
              # Strip leading "portweaver-" or "portweaver-lite-" prefix to get arch_version
              if [[ "$dirname" == portweaver-lite-* ]]; then
                arch_version="${dirname#portweaver-lite-}"
              else
                arch_version="${dirname#portweaver-}"
              fi

              # Find and copy files with renamed names
              find "$artifact_dir" \( -name "*.ipk" -o -name "*.apk" \) | while read file; do
                filename=$(basename "$file")
                # Extract package name, version, and extension
                if [[ "$filename" =~ ^(luci-(app|i18n)-portweaver[^_]*)[_-]([0-9]+(\.[0-9]+)*[^_]*)[_-].*\.(ipk|apk)$ ]]; then
                  pkgname="${BASH_REMATCH[1]}"
                  version="${BASH_REMATCH[3]}"
                  ext="${BASH_REMATCH[5]}"
                  newname="${pkgname}_${version}.${ext}"
                  cp "$file" "release/$newname"
                  echo "Copied: $filename -> $newname"
                elif [[ "$filename" =~ ^(portweaver(-lite)?)[_-]([0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?)(_.*)?\.(ipk|apk)$ ]]; then
                  pkgname="${BASH_REMATCH[1]}"
                  version="${BASH_REMATCH[3]}"
                  ext="${BASH_REMATCH[6]}"
                  newname="${pkgname}_${version}_${arch_version}.${ext}"
                  cp "$file" "release/$newname"
                  echo "Copied: $filename -> $newname"
                elif [[ "$filename" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+-r[0-9]+)\.(ipk|apk)$ ]]; then
                  pkgname="${BASH_REMATCH[1]}"
                  version="${BASH_REMATCH[2]}"
                  ext="${BASH_REMATCH[3]}"
                  newname="${pkgname}_${version}_${arch_version}.${ext}"
                  cp "$file" "release/$newname"
                  echo "Copied: $filename -> $newname"
                else
                  # Fallback: just append arch_version before extension
                  if [[ "$filename" == luci-app-portweaver* ]] || [[ "$filename" == luci-i18n-portweaver* ]]; then
                    cp "$file" "release/$filename"
                    echo "Copied: $filename -> $filename"
                  else
                    newname="${filename%.*}_${arch_version}.${filename##*.}"
                    cp "$file" "release/$newname"
                    echo "Copied: $filename -> $newname"
                  fi
                fi
              done
            fi
          done
          cd release
          ls -lh

      - name: Generate Release Info
        id: release_info
        run: |
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: PortWeaver ${{ steps.release_info.outputs.date }}
          body: |
            ## PortWeaver OpenWrt Packages

            Built with OpenWrt SDK (24.10.5 and 25.12.0)

            ### Installation

            **Full version** (includes frpc, frps, ddns):
            ```bash
            opkg install portweaver_*.ipk
            opkg install luci-app-portweaver_*.ipk
            # For APK format (newer OpenWrt versions):
            apk add portweaver_*.apk
            apk add luci-app-portweaver_*.apk
            ```

            **Lite version** (uci/ubus only, smaller binary for resource-constrained devices):
            ```bash
            opkg install portweaver-lite_*.ipk
            opkg install luci-app-portweaver_*.ipk
            # For APK format (newer OpenWrt versions):
            apk add portweaver-lite_*.apk
            apk add luci-app-portweaver_*.apk
            ```

            > **Note:** `portweaver` and `portweaver-lite` conflict with each other — install only one.

            ### Supported Architectures
            - x86_64
            - bcm27xx (Raspberry Pi series)
            - ramips/mt7621 (MT7621 routers)
            - ath79 (AR71xx/AR9xxx routers)
            - bcm53xx
            - armsr/armv8

            Built on: ${{ steps.release_info.outputs.date }}
          files: |
            release/*.ipk
            release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
